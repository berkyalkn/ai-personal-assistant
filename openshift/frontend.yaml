apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-frontend
  labels:
    app: assistant-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: assistant-frontend
        tier: frontend
    spec:
      containers:
        - name: assistant-frontend
          image: berkayalkn/personal-assistant-frontend:v1
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-frontend-svc
spec:
  selector:
    app: assistant-frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: assistant-frontend-route
spec:
  to:
    kind: Service
    name: assistant-frontend-svc
  port:
    targetPort: 8080